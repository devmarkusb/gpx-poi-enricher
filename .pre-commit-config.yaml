# Example config shipped with mb-pre-commit (see configs/v4). Edit freely; CMake may refresh
# this file on configure unless you disable PRE_COMMIT_INSTALL_EXAMPLE_CONFIG.
# https://pre-commit.com/
minimum_pre_commit_version: '4.0.0'
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-added-large-files
    -   id: check-case-conflict
    -   id: check-json
    -   id: check-merge-conflict
    -   id: check-symlinks
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: mixed-line-ending
    -   id: trailing-whitespace

    # Markdown linting
    # Config file: .markdownlint.yaml
  - repo: https://github.com/igorshubovych/markdownlint-cli
    # v0.45+ requires Node 20+; pin for Node 18 LTS dev machines (see issue #508).
    rev: v0.44.0
    hooks:
    - id: markdownlint

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        exclude: ^android/Gemfile\.lock$

    # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.9.0
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
        # pyupgrade 3.9 + CPython 3.14 can raise TypeError in tokenizer; pin hook interpreter.
        language_version: python3.13

    # CMake linting and formatting
  - repo: https://github.com/BlankSpruce/gersemi
    rev: 0.26.1
    hooks:
    - id: gersemi
      name: CMake linting

    # Clang-format for C++
    # This brings in a portable version of clang-format.
    # See also: https://github.com/ssciwr/clang-format-wheel
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.2
    hooks:
    - id: clang-format
      types_or: [c++, c]
